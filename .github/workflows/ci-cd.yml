# ============================================================
# AMASCI - CI/CD Pipeline
# Build, Test, Lint, Security Scan, Docker Build, Deploy
# ============================================================

name: AMASCI CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # --- Backend Lint & Format ---
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          cd backend
          pip install ruff black isort mypy
      - name: Run Ruff
        run: cd backend && ruff check app/
      - name: Run Black (check)
        run: cd backend && black --check app/
      - name: Run isort (check)
        run: cd backend && isort --check-only app/

  # --- Backend Unit Tests ---
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amasci_test
          POSTGRES_PASSWORD: amasci_test_pass
          POSTGRES_DB: amasci_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+asyncpg://amasci_test:amasci_test_pass@localhost:5432/amasci_test_db
          SECRET_KEY: test-secret-key-ci
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test
        run: |
          cd backend
          pytest tests/ --override-ini="addopts=" -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing -x
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # --- Frontend Lint & Type Check ---
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

  # --- Frontend Build ---
  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # --- Security Scan ---
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install safety
        run: pip install safety bandit
      - name: Check dependencies for vulnerabilities
        run: cd backend && safety check -r requirements.txt --output text || true
      - name: Run Bandit security scan
        run: cd backend && bandit -r app/ -f json -o bandit-report.json || true
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: backend/bandit-report.json

  # --- Docker Build ---
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}

  # --- Deploy to Staging ---
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "Deploying AMASCI ${{ github.sha }} to staging"
          echo "docker compose -f docker-compose.staging.yml pull"
          echo "docker compose -f docker-compose.staging.yml up -d"

  # --- Integration Tests (Staging) ---
  integration-test:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - name: Wait for staging
        run: sleep 30
      - name: Run integration tests
        run: |
          echo "Running integration tests against staging"
          curl -sf http://localhost:8080/health || echo "Staging health check (would run against real staging URL)"
          echo "API endpoint tests would execute here"
          echo "E2E smoke tests would execute here"

  # --- Deploy to Production ---
  deploy-production:
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deploying AMASCI ${{ github.sha }} to production"
          echo "docker compose -f docker-compose.prod.yml --env-file .env.production pull"
          echo "docker compose -f docker-compose.prod.yml --env-file .env.production up -d"
      - name: Verify deployment
        run: |
          echo "Verifying production deployment health"
          echo "curl -sf https://api.amasci.io/api/v1/health"
