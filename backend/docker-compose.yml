# ============================================================
# AMASCI - Docker Compose Configuration
# Services: FastAPI, PostgreSQL, Neo4j
# ============================================================

version: "3.9"

services:
  # --- FastAPI Backend ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amasci-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://amasci_user:amasci_password@postgres:5432/amasci_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j_password
    volumes:
      - ./app:/app/app
      - upload_data:/app/data/uploads
      - model_data:/app/data/models
      - log_data:/app/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - amasci-network

  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: amasci-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: amasci_user
      POSTGRES_PASSWORD: amasci_password
      POSTGRES_DB: amasci_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amasci_user -d amasci_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - amasci-network

  # --- Neo4j Graph Database ---
  neo4j:
    image: neo4j:5.15-community
    container_name: amasci-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - amasci-network

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  upload_data:
    driver: local
  model_data:
    driver: local
  log_data:
    driver: local

networks:
  amasci-network:
    driver: bridge
