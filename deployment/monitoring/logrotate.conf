# ============================================================
# AMASCI - Log Rotation Configuration
# Place in /etc/logrotate.d/amasci on the host
# ============================================================

/app/data/logs/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 amasci amasci
    sharedscripts
    postrotate
        docker kill --signal=USR1 amasci-api 2>/dev/null || true
        docker kill --signal=USR1 amasci-nginx 2>/dev/null || true
    endscript
}

/var/log/nginx/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 nginx nginx
    sharedscripts
    postrotate
        docker kill --signal=USR1 amasci-nginx 2>/dev/null || true
    endscript
}
