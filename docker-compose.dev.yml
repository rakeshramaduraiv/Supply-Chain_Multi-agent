# ============================================================
# AMASCI - Development Docker Compose
# Hot-reload enabled for backend and frontend
# ============================================================

services:
  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: amasci-api-dev
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - WORKERS=1
      - DATABASE_URL=postgresql+asyncpg://amasci_user:amasci_dev_pass@postgres:5432/amasci_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j_dev_pass
      - SECRET_KEY=dev-secret-key-not-for-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - LOG_LEVEL=DEBUG
      - HOLDOUT_START_DATE=2017-10-01
      - USE_REAL_HOLDOUT_ACTUALS=true
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - upload_data:/app/data/uploads
      - model_data:/app/data/models
      - ./backend/scripts:/app/scripts
      - ./backend/data/raw:/app/data/raw
      - ./backend/data/stages:/app/data/stages
      - ./backend/data/processed:/app/data/processed
      - ./backend/data/actuals_real:/app/data/actuals_real
      - ./backend/data/user_uploads:/app/data/user_uploads
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --log-level info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - amasci-net

  postgres:
    image: postgres:16-alpine
    container_name: amasci-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: amasci_user
      POSTGRES_PASSWORD: amasci_dev_pass
      POSTGRES_DB: amasci_db
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amasci_user -d amasci_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - amasci-net

  neo4j:
    image: neo4j:5.15-community
    container_name: amasci-neo4j-dev
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j_dev_pass
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_bolt_advertised__address: "localhost:7687"
      NEO4J_server_http_advertised__address: "localhost:7474"
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_server_config_strict__validation_enabled: "false"
    volumes:
      - neo4j_dev_data:/data
      - neo4j_dev_plugins:/var/lib/neo4j/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j_dev_pass 'RETURN 1' || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 180s
    restart: unless-stopped
    networks:
      - amasci-net

volumes:
  pg_dev_data:
  neo4j_dev_data:
  neo4j_dev_plugins:
  upload_data:
  model_data:

networks:
  amasci-net:
    driver: bridge
